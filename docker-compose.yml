services:
  rh-feed:
    build: .
    container_name: rh-feed
    ports:
      - "8788:8788"
    env_file:
      - .env
    environment:
      PORT: "8788"
      CHAIN: robinhood
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
