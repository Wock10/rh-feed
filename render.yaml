services:
  - type: web
    name: rh-feed
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHAIN
        value: robinhood
      - key: PORT
        value: "8788"
      - key: OPENSEA_API_KEY
        sync: false
      - key: MINT_WALLET_ADDRESS
        sync: false
